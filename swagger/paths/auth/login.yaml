tags:
  - Auth
summary: Login a user
operationId: loginUser
description: 'Login a user with payload'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: "john@example.com"
          password:
            description: "User's password"
            type: string
            example: "john12345"

responses:
  '200':
    description: Login a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              example: {accessToken: '/QU4/lXBPxeCHNBJWq+Qdr2nnBOHcf90466S+8Qi'}
  '404':
    $ref: '../../components/responses/404.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
