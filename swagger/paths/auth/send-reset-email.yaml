tags:
  - Auth
summary: Send email to reset password
operationId: sendResetEmail
description:
  "Sends a password reset email to the provided address.  The email contains a reset link with a JWT token as a query parameter.
  The token can be used to verify the user's identity during password reset."
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: "User's email"
            type: string
            example: 'john@example.com'
responses:
  '200':
    description: Send reset email
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent!
            data:
              type: object
              description: Empty object since no additional data is returned.
              example: {}
  '404':
    $ref: '../../components/responses/404.yaml'

x-notes:
  reset_link_format: "https://yourapp.com/reset-password?token=JWT_TOKEN_HERE"
  token_details:
    type: JWT
    purpose: "Used to authorize password reset action"
    expires_in: "5 minutes"
