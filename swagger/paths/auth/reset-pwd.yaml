tags:
  - Auth
summary: Reset password
operationId: resetPwd
description: "Resets the user's password using a JWT token received via email.
  The token must be sent in the request body along with the new password."
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - token
        properties:
          password:
            description: "User's password"
            type: string
            example: "john12345"
          token:
            description: "JWT token"
            type: string
            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
responses:
  '200':
    description: Password successfully reset
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
              description: Empty object since no additional data is returned.
              example: {}
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'

